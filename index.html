<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görev Yönetim Sistemi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1 style="margin: 0;">Görev Yönetim Paneli</h1>
            
            <div class="header-actions" style="display: flex; gap: 10px;">
                <a href="admin.html" id="admin-btn" class="btn-action" style="background-color: #ff9800; text-decoration: none; display: flex; align-items: center;">Yönetici Paneli</a>
                <button id="logout-btn" class="btn-action">Çıkış Yap</button>
            </div>
        </header>
        <section class="dashboard-section">
            <div class="stat-card">
                <h3>Toplam Görev</h3>
                <p id="stat-total">0</p>
            </div>
            <div class="stat-card stat-success">
                <h3>Tamamlanan</h3>
                <p id="stat-completed">0</p>
            </div>
            <div class="stat-card stat-pending">
                <h3>Kalan İşler</h3>
                <p id="stat-pending">0</p>
            </div>
        </section>

        <section class="form-section">
            <h2>Yeni Görev Ekle</h2>
            <form id="task-form">
                <input type="text" id="task-title" placeholder="Görev başlığını yazın..." required>
                <textarea id="task-desc" placeholder="Görev detaylarını yazın (İsteğe bağlı)..." rows="3"></textarea>
                
                <div class="form-row">
                    <select id="task-priority">
                        <option value="0">Düşük Öncelik</option>
                        <option value="1" selected>Orta Öncelik</option>
                        <option value="2">Yüksek Öncelik</option>
                    </select>
                    <button type="submit" id="submit-btn">Görevi Ekle</button>
                </div>
            </form>
        </section>

        <hr>

        <section class="list-section">
            <section class="filter-section">
            <input type="text" id="search-input" placeholder="Görevlerde ara...">
            <select id="status-filter">
                <option value="all">Tüm Görevler</option>
                <option value="0">Yapılacaklar</option>
                <option value="1">Devam Edenler</option>
                <option value="2">Tamamlananlar</option>
            </select>
        </section>
            <h2>Mevcut Görevler</h2>
            <div id="task-list" class="task-list">
                <p class="loading-text">Görevler yükleniyor...</p>
            </div>
        </section>
    </div>

    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
